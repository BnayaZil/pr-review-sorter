<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PR Review Sorter — test fixture</title>
    <link rel="stylesheet" href="../extension/styles.css" />
    <style>
      body { font: 13px -apple-system, sans-serif; margin: 16px; }
      #files > .file { border: 1px solid #d0d7de; border-radius: 6px; margin-bottom: 10px; }
      .file-header { background: #f6f8fa; padding: 6px 10px; display: flex; }
      .file-info { display: flex; gap: 8px; }
      .file-path { font-family: monospace; }
      .diff-row { display: flex; padding: 0 8px; font-family: monospace; line-height: 18px; }
      .diff-row .ln { width: 28px; color: #888; }
    </style>
  </head>
  <body>
    <!-- A GitHub-like "Files changed" list, deliberately in NON-review order. -->
    <div id="files">
      <div class="file js-file" data-tagsearch-path="src/zeta.ts">
        <div class="file-header"><div class="file-info"><a class="file-path" title="src/zeta.ts">src/zeta.ts</a></div></div>
        <div class="file-body">
          <div class="diff-row" data-line-number="1"><span class="ln">1</span><span class="code">export const z = 1</span></div>
          <div class="diff-row" data-line-number="2"><span class="ln">2</span><span class="code">export const z2 = 2</span></div>
        </div>
      </div>
      <div class="file js-file" data-tagsearch-path="src/alpha.ts">
        <div class="file-header"><div class="file-info"><a class="file-path" title="src/alpha.ts">src/alpha.ts</a></div></div>
        <div class="file-body">
          <div class="diff-row" data-line-number="1"><span class="ln">1</span><span class="code">import './zeta'</span></div>
          <div class="diff-row" data-line-number="2"><span class="ln">2</span><span class="code">export function main() {}</span></div>
          <div class="diff-row" data-line-number="3"><span class="ln">3</span><span class="code">  return main()</span></div>
          <div class="diff-row" data-line-number="4"><span class="ln">4</span><span class="code">}</span></div>
        </div>
      </div>
      <div class="file js-file" data-tagsearch-path="src/mid.ts">
        <div class="file-header"><div class="file-info"><a class="file-path" title="src/mid.ts">src/mid.ts</a></div></div>
        <div class="file-body">
          <div class="diff-row" data-line-number="1"><span class="ln">1</span><span class="code">export const m = 3</span></div>
        </div>
      </div>
    </div>

    <script src="../extension/content.js"></script>
  </body>
</html>
